[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-bf16-proj"
version = "0.1.0"
description = "TileLang BF16 projection kernels for OpenKernelChallenge"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "tilelang",
]

[tool.setuptools]
py-modules = ["v1", "v2"]
